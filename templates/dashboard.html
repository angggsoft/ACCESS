<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESS — Sistema de Asistencia Biométrica y Pre-Nómina</title>

  <!-- Favicons Dinámicos / Adaptativos según el tema (Modo Claro vs Modo Oscuro) -->
  <link id="favicon-svg" rel="icon" type="image/svg+xml" href="/assets/access.svg?v=3">
  <link id="favicon-ico" rel="alternate icon" type="image/x-icon" href="/assets/access_dark.ico?v=3">

  <script>
    // Detección y sincronización reactiva del favicon según el tema del navegador
    (function() {
      const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
      function applyThemeFavicon(e) {
        const isDark = e.matches;
        const svgEl = document.getElementById('favicon-svg');
        const icoEl = document.getElementById('favicon-ico');
        if (svgEl) svgEl.href = isDark ? '/assets/access_white.svg?v=3' : '/assets/access.svg?v=3';
        if (icoEl) icoEl.href = isDark ? '/assets/access_light.ico?v=3' : '/assets/access_dark.ico?v=3';
      }
      if (darkQuery.addEventListener) {
        darkQuery.addEventListener('change', applyThemeFavicon);
      } else if (darkQuery.addListener) {
        darkQuery.addListener(applyThemeFavicon);
      }
      applyThemeFavicon(darkQuery);
    })();
  </script>

  <!-- Google Fonts: Google Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script>
    const _origWarn = console.warn;
    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _origWarn.apply(console, args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            offwhite: '#F9FAFB',
            surface: '#FFFFFF',
            charcoal: {
              50: '#F4F4F5',
              100: '#E4E4E7',
              200: '#D4D4D8',
              300: '#A1A1AA',
              400: '#71717A',
              500: '#52525B',
              600: '#3F3F46',
              700: '#27272A',
              800: '#1F2937',
              900: '#18181B',
              950: '#0B0F17',
            }
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
            'xs': '0 1px 3px 0 rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #E9ECF1;
      color: #18181B;
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .ph, [class^="ph-"], [class*=" ph-"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      line-height: 1;
    }
    .sidebar-transition {
      transition: width 220ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: width;
    }

    /* ========================================================
       DYNAMIC ISLAND (iOS Authentic Spring Physics & Material)
       ======================================================== */
    .dynamic-island {
      height: 36px;
      border-radius: 9999px;
      overflow: hidden;
      isolation: isolate;
      background-color: #000000;
      /* iOS specular glass rim + deep ambient occlusion shadow */
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.22),
        inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.05),
        0 0 0 0.5px rgba(255, 255, 255, 0.08),
        0 8px 24px -4px rgba(0, 0, 0, 0.45),
        0 2px 6px -1px rgba(0, 0, 0, 0.25);
      /* Apple's fluid spring timing function with subtle rubber overshoot */
      transition:
        width 520ms cubic-bezier(0.34, 1.35, 0.64, 1),
        height 420ms cubic-bezier(0.34, 1.35, 0.64, 1),
        transform 280ms cubic-bezier(0.34, 1.4, 0.64, 1),
        box-shadow 260ms ease;
      will-change: width, height, transform;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .dynamic-island:hover {
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.28),
        inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.08),
        0 0 0 0.5px rgba(255, 255, 255, 0.12),
        0 12px 30px -4px rgba(0, 0, 0, 0.55),
        0 4px 10px -2px rgba(0, 0, 0, 0.35);
    }

    /* Tactile haptic squish on click */
    .dynamic-island:active {
      transform: scale(0.96) !important;
      transition: transform 120ms cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .dynamic-island.is-activity {
      height: 40px;
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.26),
        inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.06),
        0 0 0 0.5px rgba(255, 255, 255, 0.14),
        0 12px 36px -4px rgba(0, 0, 0, 0.55),
        0 4px 12px -2px rgba(0, 0, 0, 0.35);
    }

    /* Organic Squash & Stretch Morph Animation (iOS Fluid Spring Pulse) */
    @keyframes islandOrganicMorph {
      0% { transform: scale(1, 1); }
      22% { transform: scale(1.045, 0.94); }
      52% { transform: scale(0.985, 1.018); }
      78% { transform: scale(1.008, 0.995); }
      100% { transform: scale(1, 1); }
    }
    .dynamic-island.is-morphing {
      animation: islandOrganicMorph 520ms cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    /* Radial Spring Dissolve for Content morphing out of the black core */
    .island-swap-enter-active {
      transition:
        opacity 240ms cubic-bezier(0.16, 1, 0.3, 1) 70ms,
        transform 380ms cubic-bezier(0.34, 1.4, 0.64, 1) 70ms,
        filter 240ms ease 70ms;
    }
    .island-swap-leave-active {
      transition:
        opacity 140ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
        filter 140ms ease;
      position: absolute;
    }
    .island-swap-enter-from {
      opacity: 0;
      transform: scale(0.86);
      filter: blur(3px);
    }
    .island-swap-leave-to {
      opacity: 0;
      transform: scale(1.08);
      filter: blur(2px);
    }

    @media (prefers-reduced-motion: reduce) {
      .dynamic-island,
      .island-swap-enter-active,
      .island-swap-leave-active {
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
        animation: none !important;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4D4D8;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A1A1AA;
    }
    [v-cloak] {
      display: none !important;
    }

    .modal-backdrop-anim {
      animation: modalBackdropFade 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-card-anim {
      animation: modalScaleUp 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalScaleUp {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes rowHighlight {
      0% { background-color: #ECFDF5; }
      100% { background-color: transparent; }
    }
    .new-row-flash {
      animation: rowHighlight 2.2s ease-out;
    }
  </style>

  <!-- ES Module Import Map for Vue 3 Production Build -->
  <script type="importmap">
    {
      "imports": {
        "vue": "/assets/vendor/vue.esm-browser.prod.js"
      }
    }
  </script>
</head>
<body class="h-screen w-screen flex flex-col select-none overflow-hidden bg-offwhite">

  <!-- Vue 3 Root Application Mount -->
  <div id="app" v-cloak class="h-full w-full"></div>

  <!-- Main Vue 3 Application Script -->
  <script type="module" src="/assets/js/app.js?v=20261113_cloud"></script>

</body>
</html>
