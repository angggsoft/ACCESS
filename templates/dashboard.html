<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESS — Sistema de Asistencia Biométrica y Pre-Nómina</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/quodo_icon.png">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script>
    const _origWarn = console.warn;
    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _origWarn.apply(console, args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            offwhite: '#F9FAFB',
            surface: '#FFFFFF',
            charcoal: {
              50: '#F4F4F5',
              100: '#E4E4E7',
              200: '#D4D4D8',
              300: '#A1A1AA',
              400: '#71717A',
              500: '#52525B',
              600: '#3F3F46',
              700: '#27272A',
              800: '#1F2937',
              900: '#18181B',
              950: '#0B0F17',
            }
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
            'xs': '0 1px 3px 0 rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #E9ECF1;
      color: #18181B;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .ph, [class^="ph-"], [class*=" ph-"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      line-height: 1;
    }
    .sidebar-transition {
      transition: width 220ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: width;
    }

    /* Dynamic Island */
    .dynamic-island {
      border-radius: 20px;
      overflow: hidden;
      isolation: isolate;
      background: #000;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.18);
      transform-origin: top center;
      transition:
        width 620ms cubic-bezier(0.34, 1.36, 0.64, 1),
        border-radius 480ms cubic-bezier(0.34, 1.2, 0.64, 1),
        box-shadow 420ms ease,
        transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: width, transform;
    }
    .dynamic-island.is-compact { cursor: pointer; }
    .dynamic-island.is-compact:hover { transform: scale(1.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 8px 22px rgba(0,0,0,0.26); }
    .dynamic-island.is-compact:active { transform: scale(0.96); transition-duration: 120ms; }
    .dynamic-island.is-activity { border-radius: 28px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 10px 30px rgba(0,0,0,0.30); }
    .dynamic-island.is-expanded {
      border-radius: 30px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 24px 60px rgba(0,0,0,0.42);
    }

    .island-row {
      height: 40px;
      transition: height 520ms cubic-bezier(0.34, 1.36, 0.64, 1);
    }
    .island-row.is-activity { height: 58px; }

    /* Crossfade con desenfoque entre estados (texto / actividad en vivo) */
    .island-swap-enter-active { transition: opacity 320ms ease 90ms, transform 480ms cubic-bezier(0.34, 1.4, 0.64, 1) 60ms, filter 320ms ease 60ms; }
    .island-swap-leave-active { transition: opacity 140ms ease, transform 160ms ease, filter 140ms ease; position: absolute; inset: 0; }
    .island-swap-enter-from { opacity: 0; transform: scale(0.82); filter: blur(8px); }
    .island-swap-leave-to { opacity: 0; transform: scale(0.9); filter: blur(6px); }

    .island-body {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      filter: blur(6px);
      transition:
        grid-template-rows 460ms cubic-bezier(0.32, 0.72, 0, 1),
        opacity 160ms ease-out,
        filter 160ms ease-out;
    }
    .island-body.is-expanded {
      grid-template-rows: 1fr;
      opacity: 1;
      filter: blur(0);
      transition:
        grid-template-rows 620ms cubic-bezier(0.34, 1.2, 0.64, 1),
        opacity 360ms ease-out 140ms,
        filter 360ms ease-out 120ms;
    }
    .island-body-clip { overflow: hidden; min-height: 0; }
    .island-body-content {
      position: relative;
      left: 50%;
      transform: translateX(-50%);
    }
    .island-body.is-expanded .island-stagger > * { animation: islandIn 480ms cubic-bezier(0.34, 1.3, 0.64, 1) both; }
    .island-body.is-expanded .island-stagger > *:nth-child(1) { animation-delay: 150ms; }
    .island-body.is-expanded .island-stagger > *:nth-child(2) { animation-delay: 210ms; }
    .island-body.is-expanded .island-stagger > *:nth-child(3) { animation-delay: 270ms; }
    .island-body.is-expanded .island-stagger > *:nth-child(4) { animation-delay: 330ms; }
    .island-body.is-expanded .island-stagger > *:nth-child(5) { animation-delay: 390ms; }
    @keyframes islandIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: none; } }

    /* Barra de progreso de la actividad en vivo */
    .island-progress { height: 2px; background: rgba(255,255,255,0.12); }
    .island-progress > span { display: block; height: 100%; background: #34d399; transform-origin: left; animation: islandProgress 5200ms linear forwards; }
    .island-progress.is-bounce > span { background: #fbbf24; }
    @keyframes islandProgress { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    @media (prefers-reduced-motion: reduce) {
      .dynamic-island, .island-row, .island-body, .island-swap-enter-active, .island-swap-leave-active { transition-duration: 1ms !important; }
      .island-stagger > * { animation: none !important; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4D4D8;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A1A1AA;
    }
    [v-cloak] {
      display: none !important;
    }

    .modal-backdrop-anim {
      animation: modalBackdropFade 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-card-anim {
      animation: modalScaleUp 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalScaleUp {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes rowHighlight {
      0% { background-color: #ECFDF5; }
      100% { background-color: transparent; }
    }
    .new-row-flash {
      animation: rowHighlight 2.2s ease-out;
    }
  </style>

  <!-- ES Module Import Map for Vue 3 Production Build -->
  <script type="importmap">
    {
      "imports": {
        "vue": "/assets/vendor/vue.esm-browser.prod.js"
      }
    }
  </script>
</head>
<body class="h-screen w-screen flex flex-col select-none overflow-hidden bg-offwhite">

  <!-- Vue 3 Root Application Mount -->
  <div id="app" v-cloak class="h-full w-full"></div>

  <!-- Main Vue 3 Application Script -->
  <script type="module" src="/assets/js/app.js?v=20261106_01"></script>

</body>
</html>
