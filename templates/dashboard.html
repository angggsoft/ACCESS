<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESS — Sistema de Asistencia Biométrica y Pre-Nómina</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/quodo_icon.png">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script>
    const _origWarn = console.warn;
    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _origWarn.apply(console, args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            offwhite: '#F9FAFB',
            surface: '#FFFFFF',
            charcoal: {
              50: '#F4F4F5',
              100: '#E4E4E7',
              200: '#D4D4D8',
              300: '#A1A1AA',
              400: '#71717A',
              500: '#52525B',
              600: '#3F3F46',
              700: '#27272A',
              800: '#1F2937',
              900: '#18181B',
              950: '#0B0F17',
            }
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
            'xs': '0 1px 3px 0 rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #E9ECF1;
      color: #18181B;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .ph, [class^="ph-"], [class*=" ph-"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      line-height: 1;
    }
    .sidebar-transition {
      transition: width 220ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: width;
    }

    /* Dynamic Island (Single-line status pill con transición ultra-suave y elegante) */
    .dynamic-island {
      height: 38px;
      border-radius: 9999px;
      overflow: hidden;
      isolation: isolate;
      background: #09090B;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09), 0 4px 14px rgba(0, 0, 0, 0.16);
      transition:
        width 480ms cubic-bezier(0.16, 1, 0.3, 1),
        height 420ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 360ms ease,
        background-color 240ms ease;
      will-change: width, height;
    }
    .dynamic-island.is-activity {
      height: 42px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 8px 26px rgba(0, 0, 0, 0.28);
    }

    /* Crossfade suave y orgánico entre estados */
    .island-swap-enter-active {
      transition:
        opacity 280ms cubic-bezier(0.16, 1, 0.3, 1) 90ms,
        transform 320ms cubic-bezier(0.16, 1, 0.3, 1) 90ms;
    }
    .island-swap-leave-active {
      transition:
        opacity 140ms ease,
        transform 160ms ease;
      position: absolute;
      inset: 0;
    }
    .island-swap-enter-from {
      opacity: 0;
      transform: translateY(2px);
    }
    .island-swap-leave-to {
      opacity: 0;
      transform: translateY(-2px);
    }

    @media (prefers-reduced-motion: reduce) {
      .dynamic-island,
      .island-swap-enter-active,
      .island-swap-leave-active {
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4D4D8;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A1A1AA;
    }
    [v-cloak] {
      display: none !important;
    }

    .modal-backdrop-anim {
      animation: modalBackdropFade 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-card-anim {
      animation: modalScaleUp 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalScaleUp {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes rowHighlight {
      0% { background-color: #ECFDF5; }
      100% { background-color: transparent; }
    }
    .new-row-flash {
      animation: rowHighlight 2.2s ease-out;
    }
  </style>

  <!-- ES Module Import Map for Vue 3 Production Build -->
  <script type="importmap">
    {
      "imports": {
        "vue": "/assets/vendor/vue.esm-browser.prod.js"
      }
    }
  </script>
</head>
<body class="h-screen w-screen flex flex-col select-none overflow-hidden bg-offwhite">

  <!-- Vue 3 Root Application Mount -->
  <div id="app" v-cloak class="h-full w-full"></div>

  <!-- Main Vue 3 Application Script -->
  <script type="module" src="/assets/js/app.js?v=20261106_02"></script>

</body>
</html>
